<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Capture</h1>
      <p id="status" role="status">Checking connection…</p>
      <button id="connect" type="button" hidden>Connect Capture</button>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="capture" type="button" hidden>Capture page</button>
      <p id="capture-status" role="status"></p>
      <dl id="page-details" hidden>
        <dt>Title</dt>
        <dd id="page-title" tabindex="-1"></dd>
        <dt>Domain</dt>
        <dd id="page-domain"></dd>
        <dt>URL</dt>
        <dd id="page-url"></dd>
        <dt id="page-author-label" hidden>Author</dt>
        <dd id="page-author" hidden></dd>
      </dl>
      <details id="article-preview" hidden>
        <summary>Readable text</summary>
        <p id="article-excerpt"></p>
      </details>
      <form id="capture-form" hidden>
        <details>
          <summary>Add a personal note</summary>
          <label for="personal-note">Personal note (optional)</label>
          <textarea id="personal-note" name="personal-note" rows="3"></textarea>
        </details>
        <button type="submit" disabled aria-describedby="save-availability">
          Save to Capture
        </button>
        <p id="save-availability">Connect Capture before saving.</p>
        <a id="saved-article" target="_blank" rel="noopener noreferrer" hidden
          >Open saved capture</a
        >
      </form>
      <p id="save-status" role="status" tabindex="-1"></p>
      <a id="open-library" target="_blank" rel="noopener noreferrer" hidden
        >Open library</a
      >
      <button id="disconnect" type="button" hidden>Disconnect</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
